# Public Staging Server Block
server {
    listen 80;
    server_name staging.docs.yourcompany.internal;

    # Public Frontend Docs Routing
    location /frontend {
        root /var/www/html/site-frontend;
        index index.html;
    }

    # Protected Backend Docs Routing
    location /backend {
        root /var/www/html/site-backend;
        index index.html;

        # Access control: Only allow internal staging network range
        allow 10.0.0.0/8;
        deny all;
    }
}
