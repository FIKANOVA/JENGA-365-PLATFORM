<script>
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const $ = (s, r=document) => r.querySelector(s);
  const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

  // Meta
  $('#metaDesc').textContent = DATA.meta.description;
  $('#genDate').textContent = DATA.meta.generated;
  const stack = DATA.meta.stack;
  $('#stackPills').innerHTML = Object.entries(stack).map(([k,v]) =>
    `<span class="pill"><b>${esc(k)}</b> ${esc(v)}</span>`).join('');

  // Roles
  $('#rolesTable').innerHTML = '<tr><td><b>Role</b></td><td><b>Approval</b></td><td><b>Dashboard</b></td></tr>' +
    DATA.roles.map(r => `<tr><td style="color:var(--fg)">${esc(r.role)}</td><td>${esc(r.approval)}</td><td><code>${esc(r.dashboard)}</code></td></tr>`).join('');

  // Scopes + capabilities
  $('#scopes').innerHTML = `<div class="files">${DATA.moderatorScopes.values.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div>` +
    `<p class="legend">${esc(DATA.moderatorScopes.note)}</p>`;
  $('#capTable').innerHTML = Object.entries(DATA.capabilities.map).map(([cap, scopes]) =>
    `<tr><td style="color:var(--fg);white-space:normal"><code>${esc(cap)}</code></td><td>${scopes.length ? scopes.map(s=>`<span class="tag">${esc(s)}</span>`).join(' ') : '<span class="tag db">SuperAdmin only</span>'}</td></tr>`).join('');

  // Category filters
  const cats = DATA.categories;
  const catLabel = id => (cats.find(c=>c.id===id)||{}).label || id;
  let activeCat = 'all';
  let query = '';
  const filtersEl = $('#filters');
  const mkChip = (id, label) => { const c = el('button','chip',label); c.setAttribute('aria-pressed', id===activeCat); c.onclick = () => { activeCat = id; render(); }; c.dataset.id = id; return c; };
  filtersEl.appendChild(mkChip('all','All'));
  cats.forEach(c => filtersEl.appendChild(mkChip(c.id, c.label)));

  $('#search').addEventListener('input', e => { query = e.target.value.toLowerCase(); render(); });

  const flowsEl = $('#flows');

  function matches(f) {
    if (activeCat !== 'all' && f.category !== activeCat) return false;
    if (!query) return true;
    const hay = JSON.stringify(f).toLowerCase();
    return hay.includes(query);
  }

  function flowCard(f) {
    const d = el('details','flow');
    const steps = (f.steps||[]).map(s =>
      `<li>${esc(s.action)}${s.file ? `<code class="file">${esc(s.file)}</code>` : ''}</li>`).join('');
    const db = (f.dbEffects||[]).map(x=>`<span class="tag db">${esc(x)}</span>`).join('');
    const rules = (f.rules||[]).map(r=>`<div class="rule">${esc(r)}</div>`).join('');
    const files = (f.keyFiles||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
    const views = f.views ? `<dt>pgViews</dt><dd>${f.views.map(v=>`<code>${esc(v)}</code>`).join(' ')}</dd>` : '';
    d.innerHTML = `
      <summary>
        <span class="cat">${esc(catLabel(f.category))}</span>
        <span>
          <span class="flow-name">${esc(f.name)}</span><br>
          <span class="flow-trigger">${esc(f.trigger||'')}</span>
        </span>
        <span class="chev">▶</span>
      </summary>
      <div class="flow-body">
        <dl class="kv">
          <dt>Entry point</dt><dd><code>${esc(f.entryPoint||'')}</code></dd>
          <dt>End state</dt><dd>${esc(f.endState||'')}</dd>
          ${views}
        </dl>
        <ol class="steps">${steps}</ol>
        ${db ? `<div class="tags">${db}</div>` : ''}
        ${rules}
        ${files ? `<div style="margin-top:12px"><div class="flow-trigger" style="margin-bottom:4px">Key files</div><div class="files">${files}</div></div>` : ''}
      </div>`;
    return d;
  }

  function render() {
    [...filtersEl.children].forEach(c => c.setAttribute('aria-pressed', c.dataset.id === activeCat));
    flowsEl.innerHTML = '';
    const list = DATA.flows.filter(matches);
    list.forEach(f => flowsEl.appendChild(flowCard(f)));
    $('#count').textContent = `${list.length} of ${DATA.flows.length} flows`;
    if (!list.length) flowsEl.appendChild(el('div','card','No flows match.'));
  }
  render();
</script>
